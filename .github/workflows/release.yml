name: Release Addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.4). Defaults to version in oUF_Brun.toc'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            if [[ -n "$INPUT_VER" ]]; then
              VER="${INPUT_VER#v}"
            else
              VER=$(grep -E '^## Version:' oUF_Brun.toc | sed -E 's/^## Version:[[:space:]]*//; s/\r$//')
            fi
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Package addon zip
        run: |
          VER="${{ steps.version.outputs.version }}"
          mkdir -p stage
          git archive --format=tar --prefix=oUF_Brun/ HEAD | tar -x -C stage
          sed -i -E "s/^## Version:.*/## Version: ${VER}/" stage/oUF_Brun/oUF_Brun.toc
          (cd stage && zip -r "../oUF_Brun-${VER}.zip" oUF_Brun)
          rm -rf stage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: oUF_Brun v${{ steps.version.outputs.version }}
          files: oUF_Brun-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
